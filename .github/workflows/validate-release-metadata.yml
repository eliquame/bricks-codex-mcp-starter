name: Validate Release Metadata

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - STARTER-MANIFEST.json
      - CHANGELOG.md
      - scripts/**
      - .github/workflows/**
  pull_request:
    paths:
      - VERSION
      - STARTER-MANIFEST.json
      - CHANGELOG.md
      - scripts/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python scripts/validate_release_metadata.py
